<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#12161a" />
    <script>
      // Il tema salvato va applicato prima del primo paint: aspettare React
      // produrrebbe un lampo bianco all'apertura del tema scuro.
      (function () {
        try {
          var theme = localStorage.getItem('terrain-o/ui-theme/v1');
          if (theme === 'light') {
            document.documentElement.dataset.theme = 'light';
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', '#f6f7f9');
          }
        } catch (error) {
          /* Storage bloccato: resta il tema scuro predefinito. */
        }
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <meta
      name="description"
      content="Terrain / O — bozze preliminari di mappe di orienteering da ortofoto georeferenziate. Strumento di lavoro, non una mappa certificata IOF."
    />
    <title>Terrain / O — Editor</title>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Terrain / O richiede JavaScript per funzionare.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
